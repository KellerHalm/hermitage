name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NextProject
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NextProject/package-lock.json
      - run: npm ci
      - run: npm run lint

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermitage-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: hermitage-backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NextProject
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000/api
      NEXT_PUBLIC_SITE_URL: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: NextProject/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-frontend, build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        working-directory: hermitage-backend
        run: docker build -t hermitage-backend:test .
      - name: Build frontend image
        working-directory: NextProject
        run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:5000/api --build-arg NEXT_PUBLIC_SITE_URL=http://localhost -t hermitage-frontend:test .
