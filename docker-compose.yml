services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hermitage_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermitage_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hermitage_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./hermitage-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-hermitage_secret_2026}@postgres:5432/${POSTGRES_DB:-hermitage_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_strong_random_string}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:3000,http://${HOST_IP:-localhost}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "127.0.0.1:5000:5000"

  frontend:
    build:
      context: ./NextProject
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://${HOST_IP:-localhost}:5000/api
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://${HOST_IP:-localhost}:5000/api
    ports:
      - "127.0.0.1:3000:3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - uploads_data:/uploads:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
